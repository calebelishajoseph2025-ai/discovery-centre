<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northside Discovery Centre</title>
    <meta name="description" content="Plan your visit to Northside Discovery Centre. Interactive hands-on science exhibits, custom visit planner, quiet hours, and practical visitor information." />
    <meta property="og:title" content="Northside Discovery Centre" />
    <meta property="og:description" content="Plan your visit to Northside Discovery Centre. Interactive hands-on science exhibits, custom visit planner, quiet hours, and practical visitor information." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#05090c" />
    <link rel="canonical" href="https://northside-discovery.example/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='16' fill='%2305090c'/><circle cx='16' cy='16' r='6' fill='%23F2B45C'/></svg>" />
    <link rel="preload" href="/fonts/fraunces-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ndc:theme');
          var theme = 'dark';
          if (stored === 'light' || stored === 'dark') theme = stored;
          if (stored === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-pref', stored || 'dark');
          var params = new URLSearchParams(window.location.search);
          var quiet = params.get('quiet') === '1' || localStorage.getItem('ndc:quiet') === 'true';
          if (quiet) document.documentElement.setAttribute('data-quiet', 'true');
          document.documentElement.lang = window.location.pathname.indexOf('/ta') === 0 ? 'ta' : 'en';
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TouristAttraction",
        "name": "Northside Discovery Centre",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "18 Garden Road, Riverdale"
        },
        "openingHours": "Tu-Su 10:00-17:00",
        "isAccessibleForFree": false
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
